"$schema" = "https://starship.rs/config-schema.json"

palette = "molokai"
add_newline = false
scan_timeout = 20
command_timeout = 900
continuation_prompt = "[.. ](fg:muted)"

# コピー&ペースト時に文字化けしないよう、Nerd Font のアイコン（私用領域）と
# powerline の区切り記号は使わず、ASCII のみで構成する。
format = """
$os$username$hostname$directory$git_branch$git_status$git_state
$character"""

#right_format = """
#$docker_context$terraform$golang$nodejs$python$rust$php$ruby$status$cmd_duration"""

[palettes.dracula]
# Dracula 系（公式より彩度を上げた濃いめトーン）
shadow = "#1a1b26"     # 明るいセグメント上の文字色として使用（より暗く）
chrome = "#383a59"     # 暗めパネル
panel = "#383a59"      # 暗めパネル
panel_alt = "#565f89"  # comment 寄り
violet = "#a45ff5"     # purple（濃いめ）
hot = "#ff4fb0"        # pink（濃いめ）
cyan = "#3ad6f0"       # cyan（濃いめ）
sky = "#3a9ef0"        # blue（docker/golang）
gold = "#ffd23f"       # yellow（濃いめ・ディレクトリ）
orange = "#ff9233"     # orange（濃いめ）
lime = "#2fe06a"       # green（濃いめ）
fg = "#f8f8f2"         # foreground
muted = "#565f89"      # comment

[palettes.molokai]
shadow = "#1B1D1E"
chrome = "#3E3D32"
panel = "#3E3D32"
panel_alt = "#49483E"
violet = "#C6A6FF"  # パステルパープル
hot = "#FF9AC1"     # パステルピンク
cyan = "#9FE8F5"    # パステルシアン
sky = "#A8D8F0"     # パステルブルー
gold = "#F0E6A8"    # パステルイエロー
orange = "#FFC895"  # パステルオレンジ
lime = "#C3E8A0"    # パステルグリーン
fg = "#F8F8F2"
muted = "#8A8877"

[palettes.neon_luxe]
shadow = "#0A1A2A"
chrome = "#1C344C"
panel = "#234A6B"
panel_alt = "#2E5E85"
violet = "#6FA8DC"  # 明るめの青
hot = "#4FD1C5"     # 明るめのエメラルドティール
cyan = "#4A9FD6"    # 少し濃めのブルー（git_status用）
sky = "#6EB8E8"     # 明るいスカイブルー
gold = "#A8D8F0"    # パステルブルー（ディレクトリ用アクセント）
orange = "#5FA3D6"  # 中間のブルー
lime = "#5EDCB5"    # 明るめエメラルドグリーン
fg = "#F0F7FC"
muted = "#A8BCCF"

[os]
disabled = false
style = "fg:violet bold"
format = "[$symbol]($style)"

[os.symbols]
Windows = "win"
Ubuntu = "ubuntu"
SUSE = "suse"
Raspbian = "raspbian"
Mint = "mint"
Macos = "mac"
Manjaro = "manjaro"
Linux = "linux"
Gentoo = "gentoo"
Fedora = "fedora"
Alpine = "alpine"
Amazon = "amazon"
Android = "android"
AOSC = "aosc"
Arch = "arch"
Artix = "artix"
EndeavourOS = "endeavour"
CentOS = "centos"
Debian = "debian"
Redhat = "rhel"
RedHatEnterprise = "rhel"
Pop = "pop"

[username]
show_always = true
style_user = "fg:violet bold"
style_root = "fg:orange bold"
format = "[:inamuu]($style) "

[hostname]
ssh_only = true
ssh_symbol = ""
style = "fg:fg bold"
format = "[at $hostname]($style) "
trim_at = ".local"

[directory]
style = "fg:gold bold"
read_only = " [RO]"
read_only_style = "fg:orange bold"
format = "[in $path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = ".../"

[git_branch]
symbol = ""
style = "fg:hot bold"
format = "[on $branch]($style) "
truncation_length = 24
truncation_symbol = "..."

[git_status]
style = "fg:cyan bold"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
# 記号だけを表示（件数は出さない）。ASCII のみを使用し、コピー時に化けないようにする。
conflicted = "="   # コンフリクト
ahead = "^"        # ローカルが進んでいる
behind = "v"       # ローカルが遅れている
diverged = "^v"    # 分岐（上下両方）
untracked = "?"    # 未追跡ファイル
# stash はリポジトリ全体で共有され worktree ごとに分かれないため、
# クリーンな worktree でもこのアイコンだけのセグメントが常に描画されてしまう。
# 空にすれば all_status が空になり、format の (...) が崩れてセグメント自体が消える。
# stash の有無は git stash list で確認する。
stashed = ""       # 非表示
modified = "!"     # 変更あり（unstaged）
staged = "+"       # ステージ済み
renamed = "r"      # リネーム
deleted = "x"      # 削除

[git_state]
style = "fg:orange bold"
format = "([$state( $progress_current/$progress_total)]($style) )"
rebase = "REBASE"
merge = "MERGE"
revert = "REVERT"
cherry_pick = "PICK"
bisect = "BISECT"
am = "AM"
am_or_rebase = "AM/REBASE"

[docker_context]
disabled = false
symbol = ""
style = "fg:sky bold"
format = "[docker:$context]($style) "

[terraform]
disabled = false
symbol = ""
style = "fg:violet bold"
format = "[tf:$version]($style) "

[golang]
symbol = ""
style = "fg:sky bold"
format = "[go:$version]($style) "

[nodejs]
symbol = ""
style = "fg:lime bold"
format = "[node:$version]($style) "

[python]
symbol = ""
style = "fg:cyan bold"
format = "[py:$version]($style) "

[rust]
symbol = ""
style = "fg:orange bold"
format = "[rust:$version]($style) "

[php]
symbol = ""
style = "fg:violet bold"
format = "[php:$version]($style) "

[ruby]
symbol = ""
style = "fg:hot bold"
format = "[ruby:$version]($style) "

[status]
disabled = false
style = "fg:orange bold"
format = "[x $status]($style) "
map_symbol = true

[cmd_duration]
min_time = 800
show_milliseconds = false
style = "fg:gold bold"
format = "[took $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:muted bold"
format = "[$time]($style) "

[character]
disabled = false
success_symbol = "[>](bold fg:hot)"
error_symbol = "[>](bold fg:orange)"
vimcmd_symbol = "[<](bold fg:cyan)"
vimcmd_replace_one_symbol = "[<](bold fg:gold)"
vimcmd_replace_symbol = "[<](bold fg:gold)"
vimcmd_visual_symbol = "[<](bold fg:violet)"
