onboarding = false
[keys]
prefix = "ctrl+o"

# vim風: prefix+v でコピーモード開始（デフォルトの prefix+[ を置き換え）
copy_mode = "prefix+v"

# prefix+v をコピーモードに譲るため、縦分割は prefix+| のみ
split_vertical = ["prefix+|"]

# スクロールバック全体を $EDITOR (nvim) で開く
edit_scrollback = "prefix+e"

# 直前のペインと行き来（デフォルト未割り当て）
last_pane = "prefix+;"

# vim風: navigate mode (prefix+w) 内で j/k でも選択移動できるようにする
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]

# workspaceを即切り替え（デフォルト未割り当て。copy_modeをvに移したので [ が空いた）
previous_workspace = "prefix+["
next_workspace = "prefix+]"

# 左サイドバーの番号で workspace / agent へ直接移動
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# prefix+o を tmux の display-panes 風に使うため、デフォルトの
# open_notification_target (prefix+o) は prefix+shift+o へ退避
open_notification_target = "prefix+shift+o"

# tmux の display-panes (prefix+q) 相当: 各ペイン中央に大きく番号を表示し、数字で移動
# 実体は plugins/display-panes (herdr plugin link で登録)。見た目は同ディレクトリの config.json
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "inamuu.display-panes.show"
description = "display panes (number jump)"

[worktrees]
directory = "~/worktrees"

# 左サイドバーは長いブランチ名を読みやすくし、要対応のagentを上に並べる
[ui]
sidebar_width = 34
sidebar_min_width = 26
sidebar_max_width = 52
agent_panel_sort = "priority"
status_indicators = "symbols"

# 状態、agent種別、現在の作業タイトルを2行で把握できるようにする
[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    # 状態名 (idle / working / blocked / done / unknown) ごとに色分けし、
    # 要対応の blocked と作業中の working を目立たせ、idle は沈ませる
    { token = "state_text", bold = true, rules = [
      { equals = "blocked", fg = "#ff5555" },
      { equals = "working", fg = "#f1fa8c" },
      { equals = "done", fg = "#50fa7b" },
      { equals = "idle", fg = "#6272a4", bold = false },
      { equals = "unknown", fg = "#6272a4", bold = false, dim = true },
      { contains = "error", fg = "#ff5555" },
    ] },
    { token = "agent", fg = "#bd93f9" },
  ],
  [
    { token = "terminal_title_stripped", fg = "#8be9fd" },
    { token = "workspace", dim = true },
  ],
]

# workspace名の下にブランチとGit状態を表示
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [
    { token = "branch", fg = "#50fa7b", rules = [ { equals = "main", fg = "#ff79c6", bold = true }, { equals = "master", fg = "#ff79c6", bold = true } ] },
    { token = "git_status", fg = "#f1fa8c", dim = true },
  ],
]

# エージェントのdone/入力待ちをmacOSの通知センターに出す
# 3秒その状態が続いたときだけ通知（瞬間的な状態変化を無視）
[ui.toast]
delivery = "system"
delay_seconds = 3

[theme]
name = "dracula"
auto_switch = false

# dracula をベースに、サイドバーとパネルの背景をわずかに暗くしてコントラストを付ける
[theme.custom]
sidebar_bg    = "#1e1f29"
panel_bg      = "#232530"
active_row_bg = "#3b3e52"
selection_bg  = "#44475a"
